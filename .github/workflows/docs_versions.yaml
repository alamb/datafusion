# Publishes the documentation for released versions to
# https://datafusion.apache.org/versions/<version>/
#
# Every release listed in docs/source/_static/versions.json (the version
# picker manifest) is rebuilt from its git tag whenever the manifest, the
# release configuration overlay, or the build script change on `main`, so
# adding a release to the picker is all that is needed to publish its docs,
# and older releases pick up changes to the shared configuration.
#
# The current development docs are published from `main` by docs.yaml.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs_versions.yaml
      - docs/scripts/build_versions.sh
      - docs/scripts/release/conf.py
      - docs/source/_static/versions.json
  # manual trigger
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:
    inputs:
      versions:
        description: "Space separated versions to rebuild (default: every release in versions.json)"
        required: false
        default: ""

name: Deploy DataFusion versioned docs

# docs.yaml pushes to the same branch; run the publishing workflows one at a time.
concurrency:
  group: publish-asf-site
  cancel-in-progress: false

jobs:
  build-versions:
    permissions:
      contents: write
    name: Build versioned docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout asf-site branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: asf-site
          path: asf-site

      - name: Setup docs builder
        uses: ./.github/actions/setup-docs-builder

      - name: Build versioned docs
        env:
          # See docs.yaml
          DATAFUSION_DOCS_BASE_PATH: ${{ vars.DATAFUSION_DOCS_BASE_PATH }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -x
          # shellcheck disable=SC2086 # VERSIONS is a space separated list
          docs/scripts/build_versions.sh --output docs/build/versions ${VERSIONS}

      - name: Copy & push the generated HTML
        run: |
          set -x
          cd asf-site/
          # replace only the versions that were built; keep the current docs
          # at the site root and any other published versions
          for build in ../docs/build/versions/*/; do
            version="$(basename "${build}")"
            mkdir -p "versions/${version}"
            rsync -a --delete "${build}" "versions/${version}/"
          done
          git status --porcelain
          if [ "$(git status --porcelain)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m 'Publish versioned docs triggered by ${{ github.sha }}'
            git push
          fi
